workflows:
  unsigned-build:
    name: Unsigned Build for mygodelement
    environment:
      xcode:
        project_path: "mygodelement.xcworkspace"
        scheme: "mygodelement"
        sdk: "iphoneos"
    scripts:
      - name: Install CocoaPods
        script: |
          gem install cocoapods
          pod install
      - name: Build unsigned .app (no code signing)
        script: |
          xcodebuild clean -workspace mygodelement.xcworkspace -scheme mygodelement -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          xcodebuild build -workspace mygodelement.xcworkspace -scheme mygodelement -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Release-iphoneos/mygodelement.app